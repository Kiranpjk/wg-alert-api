services:
  api:
    image: ghcr.io/kiranpjk/wg-alert-api:main
    environment:
      DATABASE_URL: postgresql+psycopg://wg:${POSTGRES_PASSWORD:?required}@db:5432/wg_alert
      INGEST_API_KEY: ${INGEST_API_KEY:?required}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/kiranpjk/wg-alert-web:main
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wg
      POSTGRES_DB: wg_alert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U wg -d wg_alert"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
