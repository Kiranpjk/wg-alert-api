apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
images:
  - name: ghcr.io/kiranpjk/wg-alert-api
    newTag: main
  - name: ghcr.io/kiranpjk/wg-alert-web
    newTag: main
patches:
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: wg-alert.example.com
