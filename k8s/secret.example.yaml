apiVersion: v1
kind: Secret
metadata:
  name: wg-alert-api
  namespace: wg-alert
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://wg:REPLACE_WITH_DB_PASSWORD@db:5432/wg_alert
  INGEST_API_KEY: REPLACE_WITH_INGEST_KEY
  # ANTHROPIC_API_KEY: REPLACE_WITH_ANTHROPIC_KEY
  # ANTHROPIC_MODEL: claude-haiku-5-5
  # PARSE_DAILY_LIMIT: "100"
---
apiVersion: v1
kind: Secret
metadata:
  name: wg-alert-db
  namespace: wg-alert
type: Opaque
stringData:
  POSTGRES_USER: wg
  POSTGRES_DB: wg_alert
  POSTGRES_PASSWORD: REPLACE_WITH_DB_PASSWORD
