groups:
  - name: wg-alert-api
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        annotations:
          summary: Prometheus cannot scrape the API
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m]))) > 0.05
        for: 5m
        annotations:
          summary: More than 5% of API requests return 5xx
      - alert: SlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (
            rate(http_request_duration_seconds_bucket{job="api"}[5m])
          )) > 1
        for: 10m
        annotations:
          summary: API p95 latency exceeds one second
